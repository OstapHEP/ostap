name: Ostap @ macOS (Native CVMFS)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_macos:
    name: Build macOS (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    # Bypass Homebrew's untrusted tap requirement across the entire job
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ensure this platform string matches your target LCG View in CVMFS
          - { os: macos-14, lcg: dev3/latest, platform: arm64-mac14-clang160-opt }
          - { os: macos-15, lcg: dev3/latest, platform: arm64-mac15-clang170-opt }
          - { os: macos-15, lcg: LCG_110,     platform: arm64-mac15-clang170-opt }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create synthetic /cvmfs directory on macOS
        run: |
          echo "=== Creating synthetic /cvmfs root directory ==="
          
          # 1. Создаем целевую директорию
          sudo mkdir -p /Users/Shared/cvmfs
          
          # 2. Прописываем синтетическую связь в /etc/synthetic.conf
          # Важно: между 'cvmfs' и '/Users/Shared/cvmfs' должен быть строго символ табуляции (\t)!
          printf "cvmfs\t/Users/Shared/cvmfs\n" | sudo tee -a /etc/synthetic.conf

          # 3. Принуждаем macOS смонтировать synthetic точку без перезагрузки
          sudo apfs.util -c 2>/dev/null || sudo mount -t synthetic / / 2>/dev/null || true

          # 4. Если apfs.util не сработал, делаем симлинк как фолбэк
          if [ ! -d "/cvmfs" ]; then
            sudo ln -s /Users/Shared/cvmfs /cvmfs 2>/dev/null || true
          fi

          # 5. Проверяем доступность точки /cvmfs
          ls -ld /cvmfs
	  

      # 2. Настраиваем Homebrew Taps (как у вас)
      - name: Trust CVMFS Homebrew Taps
        run: |
          brew tap cvmfs/cvmfs || true
          brew tap macos-fuse-t/cask || true
          brew trust cvmfs/cvmfs || true
          brew trust macos-fuse-t/cask || true

      # 3. Монтируем CVMFS, принудительно указав mountpoint = /cvmfs
      - name: Install and Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: 'sft.cern.ch,sft-nightlies.cern.ch'
          cvmfs_mountpoint: '/cvmfs'

      - name: Verify CVMFS Access on macOS
        run: |
          lcg_script="/cvmfs/sft.cern.ch/lcg/views/${{ matrix.lcg }}/${{ matrix.platform }}/setup.sh"
          if [ ! -f "${lcg_script}" ]; then 
            printf "::error::No %s is found!\n" "${lcg_script}"
            exit 1
          fi
          echo "CVMFS successfully mounted on macOS!"

      - name: Clean environment for CVMFS / LCG (like Azure)
        run: |
          echo "=== Cleaning up GitHub Actions environment ==="

          # 1. Удаляем Homebrew и пути Python из PATH, сохраняя системные утилиты
          NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v "/opt/homebrew/bin" | grep -v "/Users/runner/.local" | tr '\n' ':')
          echo "PATH=${NEW_PATH}" >> $GITHUB_ENV

          # 2. Сбрасываем конфликтные переменные Python и CMake
          echo "PYTHONPATH=" >> $GITHUB_ENV
          echo "PYTHONHOME=" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=" >> $GITHUB_ENV
          echo "CMAKE_MODULE_PATH=" >> $GITHUB_ENV

          # 3. Отключаем проверку обновлений pip
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> $GITHUB_ENV

      - name: Build Ostap on macOS
        run: |
          # Limit C++ build concurrency to prevent Out-Of-Memory (OOM) failures
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./.aux/build_with_lcg ${{ matrix.lcg }} ${{ matrix.platform }}

      - name: Test Ostap on macOS
        run: |
          ./.aux/test_with_lcg ${{ matrix.lcg }} ${{ matrix.platform }}

      - name: Archive macOS production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.os }}-${{ strategy.job-index }}
          path: build/Testing

