name: Ostap @ macOS (Native CVMFS)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_macos:
    name: Build macOS (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, lcg: dev3/latest, platform: arm64-mac14-clang160-opt }
          - { os: macos-15, lcg: dev3/latest, platform: arm64-mac15-clang170-opt }
          - { os: macos-15, lcg: LCG_110,     platform: arm64-mac15-clang170-opt }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configure Homebrew tap trust settings
      - name: Trust CVMFS Homebrew Taps
        run: |
          brew tap cvmfs/cvmfs || true
          brew tap macos-fuse-t/cask || true
          brew trust cvmfs/cvmfs || true
          brew trust macos-fuse-t/cask || true

      # 2. Mount CVMFS repositories
      - name: Install and Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: 'sft.cern.ch,sft-nightlies.cern.ch'

      # 3. Create Root Symlink (/cvmfs -> Real Mount Point)
      - name: Enable Root /cvmfs Symlink
        run: |
          # Find real mount location created by Fuse-T / CVMFS
          CVMFS_REAL=""
          if [ -d "/Users/Shared/cvmfs/sft.cern.ch" ]; then
            CVMFS_REAL="/Users/Shared/cvmfs"
          elif [ -d "/Users/runner/cvmfs/sft.cern.ch" ]; then
            CVMFS_REAL="/Users/runner/cvmfs"
          elif [ -d "/cvmfs/sft.cern.ch" ]; then
            CVMFS_REAL="/cvmfs"
          fi

          echo "Detected actual CVMFS directory at: ${CVMFS_REAL}"

          # If CVMFS is not mounted at /cvmfs directly, create synthetic link/symlink
          if [ "${CVMFS_REAL}" != "/cvmfs" ] && [ -n "${CVMFS_REAL}" ]; then
            echo "Creating synthetic root link /cvmfs -> ${CVMFS_REAL}..."
            
            # Synthetic link registration (tab-separated requirement)
            printf "cvmfs\t%s\n" "${CVMFS_REAL}" | sudo tee -a /etc/synthetic.conf
            
            # Force APFS synthetic mounts reload
            sudo apfs.util -B || true
            
            # Fallback direct symlink (if synthetic.conf requires reboot)
            sudo ln -sfn "${CVMFS_REAL}" /cvmfs 2>/dev/null || true
          fi

          # Verify /cvmfs accessibility
          if [ ! -d "/cvmfs/sft.cern.ch" ]; then
            echo "::error::Failed to map /cvmfs to ${CVMFS_REAL}"
            exit 1
          fi

          echo "Successfully established /cvmfs mount point."

      # 4. Verify LCG Environment setup script access via native /cvmfs path
      - name: Verify CVMFS Access on macOS
        run: |
          lcg_script="/cvmfs/sft.cern.ch/lcg/views/${{ matrix.lcg }}/${{ matrix.platform }}/setup.sh"
          if [ ! -f "${lcg_script}" ]; then 
            printf "::error::No %s is found!\n" "${lcg_script}"
            exit 1
          fi
          echo "CVMFS setup script confirmed at: ${lcg_script}"

      # 5. Clean external runner environment variables
      - name: Clean environment for CVMFS / LCG
        run: |
          echo "=== Cleaning up GitHub Actions environment ==="
          
          # Remove Homebrew binaries and runner-local Python directories from PATH
          NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v "/opt/homebrew/bin" | grep -v "/Users/runner/.local" | tr '\n' ':')
          echo "PATH=${NEW_PATH}" >> $GITHUB_ENV

          # Reset variables to prevent Homebrew CMake / Python interference
          echo "PYTHONPATH=" >> $GITHUB_ENV
          echo "PYTHONHOME=" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=" >> $GITHUB_ENV
          echo "CMAKE_MODULE_PATH=" >> $GITHUB_ENV
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> $GITHUB_ENV

      # 6. Build Ostap
      - name: Build Ostap on macOS
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./.aux/build_with_lcg ${{ matrix.lcg }} ${{ matrix.platform }}

      # 7. Execute tests
      - name: Test Ostap on macOS
        run: |
          ./.aux/test_with_lcg ${{ matrix.lcg }} ${{ matrix.platform }}

      # 8. Upload test build artifacts
      - name: Archive macOS production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.os }}-${{ strategy.job-index }}
          path: build/Testing
