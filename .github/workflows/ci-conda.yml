name: Build and Test Ostap with Conda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13   # Intel x86_64 runner
          - macos-14   # Apple Silicon (M1/M2) ARM64 runner
          - macos-15   # Apple Silicon ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Conda/Mamba using ostap-build-env.yaml
      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ostap-build-env.yml
          activate-environment: ostap-build-env
          auto-activate-base: false
          auto-update-conda: false
          show-channel-urls: true
          # Uses mamba solver for significantly faster environment resolution
          use-mamba: true

      # Check environment and compilers
      - name: Environment Diagnostics
        shell: bash -el {0}
        run: |
          conda info
          conda list
          python --version
          cmake --version

      # Build Ostap
      - name: Build Ostap
        shell: bash -el {0}
        run: |
          set -o pipefail
          source_dir="${PWD}"
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)    
          mkdir build && cd build
          cmake .. -G Ninja
          ninja -j${ncpus}
          ninja install | grep -v -E "Up-to-date|Installing"
	  
