name: Ostap @ Conda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-13   # Intel x86_64 runner
          - macos-14   # Apple Silicon (M1/M2) ARM64 runner
          - macos-15   # Apple Silicon ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Conda/Mamba using ostap-build-env.yml
      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ostap-build-env.yml
          activate-environment: ostap-build-env
          auto-activate-base: false
          auto-update-conda: false
          show-channel-urls: true
          # Uses mamba solver for significantly faster environment resolution
          use-mamba: true

      # Diagnostic step to verify activated tools and versions
      - name: Environment Diagnostics
        shell: bash -el {0}
        run: |
          conda info
          conda list
          python --version
          cmake --version

      # Build Ostap using Ninja generator
      - name: Build Ostap
        shell: bash -el {0}
        run: |
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

          mkdir build && cd build
	  
          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}"
          ninja -j"${ncpus}"
          ninja install | grep -v -E "Up-to-date|Installing"

          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}"
          ninja -j"${ncpus}"
          ninja install | grep -v -E "Up-to-date|Installing"

          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}"
          ninja -j"${ncpus}"
          ninja install | grep -v -E "Up-to-date|Installing"

          if command -v check-dependencies >/dev/null 2>&1; then
             printf "=== Checking Dependencies ===\n"
             check-dependencies
          fi

      # Test Ostap using Ninja generator
      - name: Test Ostap
        shell: bash -el {0}
        run: |
          if command -v check-dependencies >/dev/null 2>&1; then
             printf "=== Checking Dependencies ===\n"
             check-dependencies
          fi

          cd build
          OSTAP_BATCH=True COLUMNS=200 ctest -j4 -R core.core --output-on-failure --test-output-size-failed 5000000
