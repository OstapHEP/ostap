name: Ostap @ Conda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14   # Apple Silicon (M1/M2) ARM64 runner
          - macos-15   # Apple Silicon ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Conda/Mamba using ostap-build-env.yml
      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ostap-build-env.yml
          activate-environment: ostap-build-env
          auto-activate-base: false
          auto-update-conda: false
          show-channel-urls: true
          use-mamba: true

      # Diagnostic step to verify activated tools and versions
      - name: Environment Diagnostics
        shell: bash -el {0}
        run: |
          conda info
          conda list
          python --version
          cmake --version

      # Step to install libdb into the act
      - name: Install libdb & berkeleydb dependency
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge libdb

          BERKELEYDB_INCDIR="${CONDA_PREFIX}/include" \
          BERKELEYDB_LIBDIR="${CONDA_PREFIX}/lib" \
          LDFLAGS="-L${CONDA_PREFIX}/lib -Wl,-rpath,${CONDA_PREFIX}/lib" \
          CFLAGS="-I${CONDA_PREFIX}/include" \
          YES_I_HAVE_THE_RIGHT_TO_USE_THIS_BERKELEY_DB_VERSION=1 \
          python -m pip install --force-reinstall --no-cache-dir --no-build-isolation --no-binary=:all: berkeleydb

          python -c "import berkeleydb; print(berkeleydb.__version__)"

          ## YES_I_HAVE_THE_RIGHT_TO_USE_THIS_BERKELEY_DB_VERSION=1 BERKELEYDB_DIR="${CONDA_PREFIX}" python -m pip install --force-reinstall --no-binary=:all: berkeleydb
          ## python -c "import berkeleydb;print ( berkeleydb.__version__ )"
          
      # Build Ostap using Ninja generator
      - name: Build Ostap
        shell: bash -el {0}
        run: |
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)

          mkdir build && cd build

          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}"
          ninja -j"${ncpus}"
          ninja install | grep -v -E "Up-to-date|Installing"

          # Re-configure CMake so CTest detects all generated and installed tests
          cmake ..

          if command -v check-dependencies >/dev/null 2>&1; then
              printf "=== Checking Dependencies ===\n"
              check-dependencies
          fi

      # Test Ostap using Ninja generator
      - name: Test Ostap
        shell: bash -el {0}
        env:
          # --- 1. Prevent I/O Stalls & Buffer Locks ---
          # Force Python stdout/stderr streams to be unbuffered.
          # Prevents GitHub Actions pipes from stalling on buffer fill (~64KB).
          PYTHONUNBUFFERED: "1"

          # Dump Python tracebacks automatically on crash, segfault, or freeze.
          PYTHONFAULTHANDLER: "1"

          # --- 2. Disable GUI & Interactive Windows (Headless Mode) ---
          # Force ROOT framework to run in batch mode (no TCanvas/X11 popups).
          ROOTSYS_BATCH: "1"

          # Force Ostap framework to run in batch mode.
          OSTAP_BATCH: "1"

          # Direct Qt/PyQt to use offscreen rendering without connecting to macOS WindowServer.
          QT_QPA_PLATFORM: "offscreen"

          # Force Matplotlib to use the 'Agg' non-interactive backend (renders directly in memory).
          MPLBACKEND: "Agg"

          # 
          EXTRA_CLING_ARGS: "-Wno-macro-redefined"
          PYTHONWARNINGS: "error,ignore::DeprecationWarning,once::UserWarning,ignore::FutureWarning,ignore:::CPyCppyy"
          
        run: |

          if command -v check-dependencies >/dev/null 2>&1; then
              printf "=== Checking Dependencies ===\n"
              check-dependencies
          fi

          cd build
          
          NCPU=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1)
          OSTAP_BATCH=True COLUMNS=200 ctest -j2 -R '(_io_|sync)' --output-on-failure --test-output-size-failed 5000000
