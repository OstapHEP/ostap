name: Ostap @ Conda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14   # Apple Silicon (M1/M2) ARM64 runner
          - macos-15   # Apple Silicon ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Conda/Mamba using ostap-build-env.yml
      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ostap-build-env.yml
          activate-environment: ostap-build-env
          auto-activate-base: false
          auto-update-conda: false
          show-channel-urls: true
          use-mamba: true

      # Diagnostic step to verify activated tools and versions
      - name: Environment Diagnostics
        shell: bash -el {0}
        run: |
          conda info
          conda list
          python --version
          cmake --version

      # Step to install libdb & missing utilities (rsync)
      - name: Install libdb & system dependencies
        shell: bash -el {0}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # 1. Устанавливаем rsync и berkeley-db через Homebrew на macOS
            brew install berkeley-db rsync findutils
            
            BDB_PREFIX=$(brew --prefix berkeley-db)

            # 2. Компилируем berkeleydb с явным rpath к Homebrew
            CFLAGS="-I${BDB_PREFIX}/include" \
            LDFLAGS="-L${BDB_PREFIX}/lib -Wl,-rpath,${BDB_PREFIX}/lib" \
            BERKELEYDB_DIR="${BDB_PREFIX}" \
            YES_I_HAVE_THE_RIGHT_TO_USE_THIS_BERKELEY_DB_VERSION=1 \
            python -m pip install --force-reinstall --no-cache-dir --no-build-isolation --no-binary=berkeleydb berkeleydb
          else
            # На Linux Conda-сборка работает отлично:
            conda install -y -c conda-forge libdb rsync
            
            BERKELEYDB_DIR="${CONDA_PREFIX}" \
            YES_I_HAVE_THE_RIGHT_TO_USE_THIS_BERKELEY_DB_VERSION=1 \
            python -m pip install --no-binary=berkeleydb berkeleydb
          fi

          python -c "import berkeleydb; print('BerkeleyDB version:', berkeleydb.__version__)"

      # Build Ostap using Ninja generator
      - name: Build Ostap
        shell: bash -el {0}
        run: |
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)

          mkdir build && cd build

          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="${CONDA_PREFIX}"
          ninja -j"${ncpus}"
          ninja install | grep -v -E "Up-to-date|Installing"

          # Re-configure CMake so CTest detects all generated and installed tests
          cmake ..

          if command -v check-dependencies >/dev/null 2>&1; then
              printf "=== Checking Dependencies ===\n"
              check-dependencies
          fi

      # Test Ostap using Ninja generator
      - name: Test Ostap
        shell: bash -el {0}
        env:
          # --- 1. Prevent Multithreading Deadlocks in Cling / ROOT / OpenMP on macOS ---
          ROOT_MAX_THREADS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"

          # --- 2. Prevent I/O Stalls & Buffer Locks ---
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"

          # --- 3. Disable GUI & Interactive Windows (Headless Mode) ---
          ROOT_BATCH: "1"
          OSTAP_BATCH: "True"
          QT_QPA_PLATFORM: "offscreen"
          MPLBACKEND: "Agg"

          # --- 4. Cling & Warnings Flags ---
          EXTRA_CLING_ARGS: "-Wno-macro-redefined"
          PYTHONWARNINGS: "ignore::DeprecationWarning,once::UserWarning,ignore::FutureWarning,ignore:::CPyCppyy"

        run: |
          if command -v check-dependencies >/dev/null 2>&1; then
              printf "=== Checking Dependencies ===\n"
              check-dependencies
          fi

          cd build
          
          # Запускаем ctest с таймаутом в 300 секунд (5 мин) на каждый отдельный тест
          ctest -j1 -R '(_io_|sync)' --timeout 300 --output-on-failure --test-output-size-failed 5000000
