name: Ostap @ Conda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-13   # Intel x86_64 runner
          - macos-14   # Apple Silicon (M1/M2) ARM64 runner
          - macos-15   # Apple Silicon ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Conda/Mamba using ostap-build-env.yml
      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ostap-build-env.yml
          activate-environment: ostap-build-env
          auto-activate-base: false
          auto-update-conda: false
          show-channel-urls: true
          # Uses mamba solver for significantly faster environment resolution
          use-mamba: true
	  
      # Conditional step: Install cpufeature via Conda ONLY on x86_64 platforms
      - name: Install cpufeature on x86_64 architecture
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-13'
        shell: bash -el {0}
        run: |
          conda install -y cpufeature
	  
      # Diagnostic step to verify activated tools and versions
      - name: Environment Diagnostics
        shell: bash -el {0}
        run: |
          conda info
          conda list
          python --version
          cmake --version

      # Build Ostap using Ninja generator
      - name: Build Ostap
        shell: bash -el {0}
        run: |
          set -o pipefail
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX}
          ninja -j${ncpus}
          ninja install | grep -v -E "Up-to-date|Installing"

      # Test Ostap
      - name: Test Ostap
        shell: bash -el {0}
        run: |
          set -o pipefail
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          
          # Change directory to build root where CTest files reside
          cd build
          
          # Set runtime flags and paths for Python/C++ shared libraries
          export OSTAP_BATCH=1
          ## export PYTHONPATH="${PWD}:${PYTHONPATH}"
          ## export LD_LIBRARY_PATH="${PWD}:${LD_LIBRARY_PATH}"
          ## export DYLD_LIBRARY_PATH="${PWD}:${DYLD_LIBRARY_PATH}"
          
          # Run core tests in parallel
          COLUMNS=200 ctest -j${ncpus} -R core.core --output-on-failure --test-output-size-failed 5000000

