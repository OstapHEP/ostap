name: ostap-dev
channels:
  - conda-forge
  - conda-pypi 
  
dependencies:
  # C/C++ build tools and CMake
  - c-compiler
  - cxx-compiler
  - cmake
  - make
  - ninja
  - pkg-config

  # Core C/C++ and ROOT dependencies
  - root_base
  - gsl
  - libdb
  - libblas * *openblas
  - libcblas * *openblas
  - liblapack * *openblas
  - libopenblas

  # Base Python and packaging tools
  - python
  - pip
  - wheel
  - setuptools
  - cffi
  - ipython

  # Scientific stack and Ostap dependencies
  - numpy
  - scipy
  - numba
  - pandas
  - statsmodels
  - h5py
  - duckdb
  - xgboost
  - catboost
  - lightgbm
  - sweetviz
  - hep_ml
  - pytorch

  # Parallelism and utilities
  - pathos
  - dill
  - multiprocess
  - ppft
  - joblib
  - ipyparallel
  - zstandard
  - more-itertools
  - sortedcontainers
  - psutil
  - tabulate
  - terminaltables
  - pathvalidate
  - packaging
  - fasteners
  - py-cpuinfo

  # Pip package manager and pip-only dependencies
  - pip
  - pip:
    - terminaltables3
    - pragmastat
    - cpufeature; platform_machine == 'x86_64' or platform_machine == 'AMD64'