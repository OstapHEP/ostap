name: ostap-test-env

# Recommended channels for ROOT, Ostap, and scientific stack
channels:
  - conda-forge
  - defaults

dependencies:
  # ROOT framework from conda-forge
  - "root>=6.28"

  # Target Python runtime
  - "python>=3.10"

  # Build tools
  - c-compiler
  - cxx-compiler
  - ccache
  - cmake
  - ninja

  # GSL & friends
  - gsl
  - openblas

  # Core numerical and scientific packages
  - "numpy>=2.0"
  - "scipy>=1.6"
  - numba
  - cffi
  - pandas
  - statsmodels
  - sweetviz

  # Parallelization
  - pathos
  - dill
  - multiprocess
  - ppft
  - pox
  - joblib
  - ipyparallel

  # Utilities
  - psutil
  - more-itertools
  - py-cpuinfo
  - sortedcontainers
  - pathvalidate
  - packaging

  # Tables
  - terminaltables
  - tabulate

  # DB
  - libdb
  - gdbm
  - duckdb
  - fasteners

  # Reweightings, GoF & Two-samples tests
  - lightgbm
  - xgboost
  - hep_ml

  # Auxiliary
  - zstandard

  # Pip package manager and pip-only dependencies
  - pip
  - pip:
    - terminaltables3
    - pragmastat
    - cpufeature; platform_machine == 'x86_64' or platform_machine == 'AMD64'